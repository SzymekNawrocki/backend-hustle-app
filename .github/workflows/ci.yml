name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Security & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: ci-only-key-not-real-this-must-be-32-chars-minimum
      DATABASE_URL: postgresql://hustle:hustle@localhost:5432/hustle
      GROQ_API_KEY: test-groq-api-key-not-real
      DB_SSL: "false"
      AUTH_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Static security scan (bandit)
        run: bandit -r app -ll -x app/__pycache__

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run unit tests with coverage
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --ignore=tests/integration

  integration-tests:
    name: Integration Tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: ci-only-key-not-real-this-must-be-32-chars-minimum
      GROQ_API_KEY: test-groq-api-key-not-real
      DB_SSL: "false"
      AUTH_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
